[project]
name = "turbovec-enhanced"
version = "1.0.0"
description = "GPU-accelerated vector search, hybrid retrieval, and RAG pipeline"
authors = [
    {name = "TurboVec Enhanced Contributors"}
]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "hnswlib>=0.8.0",
    "faiss-cpu>=1.7.4",
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "rank-bm25>=0.2.2",
    "nltk>=3.8.1",
    "chromadb>=0.5.0",
    "qdrant-client>=1.9.0",
    "weaviate-client>=4.6.0",
    "anthropic>=0.30.0",
    "openai>=1.35.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "apscheduler>=3.10.4",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
gpu = ["faiss-gpu>=1.7.4"]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
turbovec-enhanced = "agent.main:main"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "W", "I", "N", "UP", "ASYNC", "S"]
ignore = ["E501", "N806", "S101"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
